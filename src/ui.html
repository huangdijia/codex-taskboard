<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex TaskBoard</title>
<style>
:root{color-scheme:light;font:13px/1.5 var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);--bg:var(--color-background-primary,#fff);--surface:var(--color-background-secondary,#f7f8fa);--ink:var(--color-text-primary,#30343b);--muted:var(--color-text-secondary,#727985);--line:var(--color-border-primary,#e7e9ed);--accent:var(--color-text-info,#446fba);--green-track:#f3f9f5;--blue-track:#f5f7fe;--purple-track:#f8f5fc;--green-bg:#e8f4eb;--green:#377953;--blue-bg:#edf2ff;--blue:#476abe;--purple-bg:#f2edfa;--purple:#7b5ca8;--shadow:0 1px 2px #1b24340a,0 2px 5px #1b243404;color:var(--ink);background:var(--bg)}
:root[data-theme="dark"]{color-scheme:dark;--bg:var(--color-background-primary,#181b20);--surface:var(--color-background-secondary,#20242b);--ink:var(--color-text-primary,#e9ecf1);--muted:var(--color-text-secondary,#a7afbc);--line:var(--color-border-primary,#353b46);--accent:var(--color-text-info,#a7c3f5);--green-track:#1c2922;--blue-track:#1e2634;--purple-track:#282232;--green-bg:#243e30;--green:#b0dfbd;--blue-bg:#29364d;--blue:#b9ccfc;--purple-bg:#3a2f4c;--purple:#d4bdef;--shadow:0 1px 3px #0003}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.app{padding:18px 20px;max-width:1600px;margin:auto}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:13px;border-bottom:1px solid var(--line)}input[type="search"],select{font-size:12px}input[type="search"]{width:100%;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:5px 10px;outline-offset:1px}input[type="checkbox"]{accent-color:var(--accent);margin:0;width:12px;height:12px;flex-shrink:0}.button{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:31px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:5px 9px;font-size:11px}.button:hover:not(:disabled){background:var(--surface);border-color:var(--muted)}.summary{color:var(--muted);font-size:10px;margin:10px 2px 13px}#notice{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:3px solid #bb8d48;border-radius:7px;padding:7px 10px;margin:9px 0;font-size:11px;line-height:1.5;overflow-wrap:anywhere}#notice:empty{display:none}#content{overflow-x:auto;padding-bottom:10px}.board{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:14px;min-width:748px;align-items:stretch}.column{--column-track:var(--green-track);--column-bg:var(--green-bg);--column-ink:var(--green);min-width:0;display:flex;flex-direction:column}.column.review{--column-track:var(--blue-track);--column-bg:var(--blue-bg);--column-ink:var(--blue)}.column.done{--column-track:var(--purple-track);--column-bg:var(--purple-bg);--column-ink:var(--purple)}.column-head{display:flex;align-items:center;gap:7px;padding:9px 13px;min-height:37px;margin:0 0 8px;border-radius:13px;background:var(--column-bg);color:var(--column-ink)}h2{font-size:12px;margin:0;font-weight:650}.column-subtitle{font-size:10px;opacity:.85}.count{margin-left:auto;min-width:19px;text-align:center;font-size:10px;font-weight:600}.cards{display:grid;flex:1 0 auto;align-content:start;gap:8px;border:1px solid var(--column-track);border-radius:17px;background:var(--column-track);padding:8px;min-height:calc(100vh - 160px)}.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px 10px;box-shadow:var(--shadow)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.card-id{color:var(--muted);font-size:10px;letter-spacing:.015em;opacity:.8}.status-dot{height:6px;width:6px;flex:0 0 6px;border-radius:50%;background:var(--column-ink)}.card-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;border:0;background:none;padding:0;width:100%;text-align:left;font-size:13px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}.card-title:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.reason{font-size:10px;color:var(--muted);margin:6px 0 7px;overflow-wrap:anywhere;white-space:pre-wrap}.tags{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px}.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;line-height:1.6;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:0 6px;max-width:100%;min-width:0}.workspace-tag{max-width:65%}.tag-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag.warning{color:var(--ink);border-style:dashed;background:var(--surface)}.card-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.updated{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);white-space:nowrap}.empty{font-size:11px;text-align:center;color:var(--muted);padding:32px 0;margin:0}.stale{border-style:dashed}.icon{width:14px;height:14px;flex-shrink:0;vertical-align:middle}.tag .icon,.updated .icon{width:11px;height:11px}@media(max-width:700px){.app{padding:14px}.toolbar{gap:8px}.board{gap:11px;grid-template-columns:repeat(3,minmax(240px,1fr));min-width:742px}.cards{min-height:calc(100vh - 200px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
.card[draggable="true"]{cursor:grab}.card.dragging{opacity:.45;border-style:dashed}.cards{position:relative}.drop-hint{display:none;position:absolute;z-index:1;top:12px;left:12px;right:12px;text-align:center;padding:8px 10px;border:1px solid var(--column-ink);border-radius:9px;background:var(--column-bg);color:var(--column-ink);font-size:11px;pointer-events:none;box-shadow:var(--shadow)}.drop-available .drop-hint{display:block}.drop-available .cards{outline:1px dashed var(--column-ink);outline-offset:-1px}.drop-over .cards{outline:2px solid var(--column-ink);outline-offset:-2px;background:var(--column-bg);border-color:var(--column-bg)}.drop-over .column-head{outline:2px solid var(--column-ink);outline-offset:2px}
.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px}.toolbar-left{min-width:0;flex:1 1 350px;flex-wrap:wrap}.options{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}.filter-chip{display:flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 10px;border:1px solid transparent;border-radius:10px;background:var(--surface);white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s,color .15s}.filter-chip:hover{color:var(--ink);border-color:var(--line)}.filter-chip:has(input:checked){color:var(--accent);background:var(--blue-bg);border-color:color-mix(in srgb,var(--blue) 28%,var(--line))}.filter-chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}.filter-chip input:focus-visible{outline:none}.toolbar-right{margin-left:auto;gap:2px;flex:0 1 auto;min-width:0;padding:0 2px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}.icon-button{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 32px;padding:7px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);transition:background .15s,color .15s,border-color .15s}.icon-button:hover:not(:disabled){color:var(--ink);background:var(--bg);border-color:var(--line)}.icon-button[data-active="true"]{color:var(--accent);background:var(--blue-bg)}.icon-button:focus-visible{outline-offset:1px}.icon-button .icon{width:16px;height:16px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.is-loading>.icon{animation:refresh-spin 1.4s linear infinite}@keyframes refresh-spin{to{transform:rotate(360deg)}}
:root[data-theme-override="light"]{--color-background-primary:#fff!important;--color-background-secondary:#f7f8fa!important;--color-text-primary:#30343b!important;--color-text-secondary:#727985!important;--color-border-primary:#e7e9ed!important;--color-text-info:#446fba!important}
:root[data-theme-override="dark"]{--color-background-primary:#181b20!important;--color-background-secondary:#20242b!important;--color-text-primary:#e9ecf1!important;--color-text-secondary:#a7afbc!important;--color-border-primary:#353b46!important;--color-text-info:#a7c3f5!important}
@media(max-width:700px){.toolbar-left{gap:7px}.toolbar{gap:8px}}@media(max-width:400px){.toolbar-left{flex-basis:100%}.toolbar-right{max-width:100%}.filter-chip{padding:0 9px}}@media(prefers-reduced-motion:reduce){.is-loading>.icon{animation:none}}
#search-dialog{width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);margin:auto;padding:0;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--ink);box-shadow:0 18px 70px #0004;overflow:hidden}#search-dialog::backdrop{background:#11182780}#search-dialog[open]{display:flex;flex-direction:column}.search-dialog-input{display:flex;align-items:center;gap:11px;padding:14px 17px;border-bottom:1px solid var(--line);flex-shrink:0}.search-dialog-input>.icon{width:18px;height:18px;color:var(--muted)}#search{height:30px;flex:1;min-width:0;padding:2px 0;border:0;border-radius:0;outline-offset:4px;font-size:14px;background:transparent;color:var(--ink)}#search::placeholder{color:var(--muted)}.search-escape{border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted);font-size:10px}.search-dialog-section{display:flex;flex-direction:column;min-height:0;padding:12px 9px 9px}.search-dialog-section>h2{padding:0 9px 9px;color:var(--muted);font-size:11px;font-weight:500}#search-results{min-height:0;overflow-y:auto;overscroll-behavior:contain}#search-status,#search-error{font-size:12px;margin:0;padding:10px 9px;color:var(--muted);overflow-wrap:anywhere}#search-status:empty,#search-error:empty{display:none}#search-error{color:var(--ink);background:var(--surface);border-radius:6px}.search-result{display:flex;flex-direction:column;gap:3px;padding:10px 11px;border-radius:7px;cursor:pointer}.search-result:hover,.search-result.selected{background:var(--surface)}.search-result[aria-disabled="true"]{opacity:.65;cursor:wait}.search-result-title{font-size:13px;font-weight:500;line-height:1.45;overflow-wrap:anywhere}.search-result-meta{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.turn-count{display:inline-flex;align-items:center;gap:4px;flex-shrink:0;margin-left:auto;border:1px solid var(--line);border-radius:20px;padding:1px 6px;color:var(--muted);font-size:10px;line-height:1.5}.turn-count .icon{width:12px;height:12px}.turn-count.incomplete{border-style:dashed}
.project-picker{position:relative;display:inline-flex;align-items:center;flex:0 1 auto;min-width:0;max-width:100%;height:34px;color:var(--muted)}#project-toggle{display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:100%;height:34px;padding:0;border:0;border-radius:5px;background:transparent;color:inherit;font-size:14px;font-weight:600}#project-toggle:hover{color:var(--ink)}#project-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#project-toggle>.picker-chevron{width:14px;height:14px;flex-shrink:0}#workspace[hidden]{display:none}#project-menu{position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:min(300px,calc(100vw - 32px));max-height:min(360px,calc(100vh - 90px));display:flex;flex-direction:column;padding:7px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);box-shadow:0 8px 28px #0002}#project-menu[hidden]{display:none}#project-search{height:32px;flex-shrink:0;padding:5px 8px;margin-bottom:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:12px}#project-list{max-height:280px;min-height:0;overflow-y:auto;overscroll-behavior:contain}.project-option{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:6px;cursor:pointer;font-size:12px}.project-option:hover,.project-option.active,.project-option.selected{background:var(--surface)}.project-option.active{box-shadow:inset 0 0 0 1px var(--line)}.project-option-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-option>.icon{width:13px;height:13px;color:var(--muted)}#project-empty{margin:0;padding:9px;font-size:11px;color:var(--muted)}#project-empty:empty{display:none}
</style>
</head>
<body>
<main class="app">
<header class="toolbar">
<div class="toolbar-left">
<div id="project-picker" class="project-picker"><select id="workspace" aria-label="项目选择" hidden><option value="">所有项目</option></select><button id="project-toggle" type="button" aria-label="项目选择：所有项目" aria-haspopup="listbox" aria-expanded="false" aria-controls="project-list"><span id="project-label">所有项目</span><svg class="icon picker-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button><div id="project-menu" hidden><input id="project-search" type="search" placeholder="搜索项目" aria-label="搜索项目名称或路径" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="project-list" autocomplete="off"><div id="project-list" role="listbox" aria-label="项目列表"></div><p id="project-empty" role="status"></p></div></div>
<div class="options"><label class="filter-chip"><input id="show-archived" type="checkbox">已归档</label><label class="filter-chip"><input id="show-subagents" type="checkbox">子 Agent</label></div>
</div>
<div class="toolbar-right">
<button id="search-toggle" class="icon-button" type="button" aria-label="打开搜索聊天" title="打开搜索聊天" aria-haspopup="dialog" aria-expanded="false" aria-controls="search-dialog"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
<button id="refresh" class="icon-button" type="button" aria-label="刷新任务" title="刷新任务"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg><span id="refresh-label" class="sr-only">刷新任务</span></button>
<button id="theme-toggle" class="icon-button" type="button" aria-label="切换为深色主题（仅当前页面）" title="切换为深色主题（仅当前页面）"></button>
</div>
</header>
<p id="summary" class="summary" role="status">正在连接…</p>
<div id="notice" role="alert"></div>
<div id="content" aria-busy="true"><div class="board"><section class="column inprogress"><div class="column-head"><h2>InProgress</h2><span class="column-subtitle">进行中</span></div><div class="cards"></div></section><section class="column review"><div class="column-head"><h2>Review</h2><span class="column-subtitle">待验收</span></div><div class="cards"></div></section><section class="column done"><div class="column-head"><h2>Done</h2><span class="column-subtitle">已完成</span></div><div class="cards"></div></section></div></div>
</main>
<dialog id="search-dialog" aria-label="搜索聊天">
<div class="search-dialog-input"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索聊天" aria-label="搜索聊天" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="search-results" aria-describedby="search-status" autocomplete="off"><span class="search-escape" aria-hidden="true">Esc</span></div>
<div class="search-dialog-section"><h2 id="search-heading">聊天</h2><p id="search-error" role="alert"></p><p id="search-status" role="status"></p><div id="search-results" role="listbox" aria-labelledby="search-heading"></div></div>
</dialog>
<!--APP_SCRIPT-->
</body>
</html>
