<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskBoard</title>
<style>
:root{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252934;background:#f7f8fa;--ink:#252934;--muted:#858c99;--line:#e6e8ed;--surface:#fff;--accent:#5165bb}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.58;cursor:wait}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app-header{background:#fff;border-bottom:1px solid var(--line);padding:17px clamp(20px,3.5vw,48px)}.header-inner{max-width:1600px;margin:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;letter-spacing:-.035em;margin-right:auto;color:#20242d}.mark{display:grid;place-items:center;width:27px;height:27px;border-radius:7px;background:#252934;color:#fff;font-size:16px;font-weight:500}.header-actions,.toolbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.button,.select{display:inline-flex;align-items:center;justify-content:center;min-height:35px;padding:7px 11px;border:1px solid #dfe3e9;border-radius:7px;background:#fff;color:#404856;font-weight:550}.button:hover,.select:hover{border-color:#aeb7c7;background:#fafbfc}.button.primary{background:#323b58;border-color:#323b58;color:#fff}.button.primary:hover{background:#222b46}.button.ghost{border-color:transparent;background:transparent;color:#687284}.select{min-width:150px;max-width:240px;justify-content:space-between}
main{max-width:1696px;margin:auto;padding:30px clamp(20px,3.5vw,48px) 56px}.page-head{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;margin-bottom:21px}h1{font-size:23px;line-height:1.2;letter-spacing:-.04em;margin:0 0 5px;color:#232833}.subtitle{margin:0;color:var(--muted);font-size:13px}.toolbar-actions .label{font-size:12px;color:var(--muted);margin-right:2px}#notice{background:#fff5ea;color:#91540d;border:1px solid #f0d9b8;padding:10px 13px;border-radius:7px;margin-bottom:16px}#notice:empty{display:none}
.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px;align-items:start}.column{background:#f1f3f6;border:1px solid #ebedf1;border-radius:9px;min-height:365px;padding:0 11px 13px}.column-head{display:flex;align-items:center;gap:9px;min-height:50px;border-bottom:1px solid #e2e5eb;margin-bottom:11px;padding:0 3px;font-size:13px;font-weight:720;color:#3d4450}.count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:#e4e7ed;color:#78818e;font-size:11px;font-weight:650}.cards{display:grid;gap:8px}.card{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e3e6eb;border-radius:7px;padding:13px 14px 12px;color:var(--ink);box-shadow:0 1px 2px #1d263008}.card:hover{border-color:#bcc5d4;box-shadow:0 2px 8px #1d26300c}.card-id{display:block;color:#a3aab5;font-size:11px;font-weight:600;letter-spacing:.02em;margin-bottom:6px}.card-title{display:block;line-height:1.42;font-size:13px;font-weight:650;overflow-wrap:anywhere;margin-bottom:13px}.card-tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:11px}.tag{font-size:11px;font-weight:600;line-height:1.3;padding:3px 7px;border-radius:4px;background:#f1f3f6;color:#687384}.tag.status{background:#eef0f8;color:#6572ab}.tag.status.working{background:#edf5ee;color:#5f896b}.tag.status.confirm{background:#eef3fa;color:#5e7fa8}.tag.status.blocked{background:#fff0ed;color:#b86d5d}.tag.status.done{background:#e9f5ef;color:#548771}.tag.priority.high,.tag.priority.urgent{background:#fff0ed;color:#bd6d5d}.tag.priority.medium{background:#fff5e7;color:#a77934}.card-meta{display:flex;align-items:center;gap:8px;border-top:1px solid #f0f1f3;padding-top:9px;font-size:11px;color:#98a0aa}.card-meta .due{margin-left:auto}.empty{color:#9aa2ad;font-size:12px;text-align:center;padding:25px 8px}.welcome{display:grid;place-items:center;min-height:300px;text-align:center;color:var(--muted)}.welcome h2{font-size:17px;color:var(--ink);margin:0 0 4px}.welcome p{margin:0}
dialog{width:min(480px,calc(100vw - 30px));border:1px solid var(--line);border-radius:11px;padding:0;color:var(--ink);background:var(--surface);box-shadow:0 20px 55px #1e26343d}dialog::backdrop{background:#1a24346e}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:19px 22px 8px}.dialog-head h2{font-size:18px;margin:0}.close{border:0;background:transparent;color:#8a929f;font-size:23px;line-height:1}form{padding:10px 22px 22px;display:grid;gap:13px}form label{display:grid;gap:6px;font-size:12px;font-weight:650;color:#535c6b}form input,form textarea,form select{width:100%;padding:9px 10px;background:#fff;color:var(--ink);border:1px solid #d8dde6;border-radius:6px}form textarea{min-height:88px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
@media(max-width:850px){.board{overflow-x:auto;grid-template-columns:repeat(3,minmax(250px,1fr))}}@media(max-width:540px){main{padding-top:22px}.app-header{padding-top:12px;padding-bottom:12px}.header-actions{width:100%}.board{gap:10px}.column{min-height:280px}}
</style></head><body>
<header class="app-header"><div class="header-inner"><div class="brand"><span class="mark" aria-hidden="true">▦</span>TaskBoard</div><div class="header-actions"><button class="button" id="new-board" type="button">＋ 新建项目</button><button class="button primary" id="new-task" type="button">＋ 新建任务</button></div></div></header>
<main><div class="page-head"><div><h1>TaskBoard</h1><p class="subtitle" id="board-subtitle">正在加载任务…</p></div><div class="toolbar-actions"><label class="label" for="board-select">项目</label><select class="select" id="board-select" aria-label="筛选项目"></select><button class="button ghost" id="refresh" type="button">刷新</button></div></div><div id="notice" role="alert"></div><div id="content" aria-live="polite"></div></main>
<dialog id="board-dialog"><div class="dialog-head"><h2>新建项目</h2><button class="close" type="button" data-close="board-dialog" aria-label="关闭">×</button></div><form id="board-form"><label>项目名称<input name="name" maxlength="80" required placeholder="例如：产品设计"></label><div class="actions"><button class="button" type="button" data-close="board-dialog">取消</button><button class="button primary" type="submit">创建项目</button></div></form></dialog>
<dialog id="task-dialog"><div class="dialog-head"><h2 id="task-dialog-title">新建任务</h2><button class="close" type="button" data-close="task-dialog" aria-label="关闭">×</button></div><form id="task-form"><label>所属项目<select name="board_id" required></select></label><label>任务标题<input name="title" maxlength="200" required placeholder="要完成什么？"></label><label>说明<textarea name="description" maxlength="10000" placeholder="补充背景或验收要求"></textarea></label><div class="row"><label>状态<select name="status"><option value="backlog">待整理</option><option value="todo">等待认领</option><option value="in_progress">处理中</option><option value="in_review">等待确认</option><option value="blocked">受阻</option><option value="done">已完成</option></select></label><label>优先级<select name="priority"><option value="none">未设</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option><option value="urgent">紧急</option></select></label></div><label>截止日期<input name="due_date" type="date"></label><div class="actions"><button class="button" type="button" data-close="task-dialog">取消</button><button class="button primary" type="submit" id="save-task">保存任务</button></div></form></dialog>
<!--APP_SCRIPT--></body></html>
